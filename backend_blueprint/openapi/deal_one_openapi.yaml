components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Access Token (15-min lifespan). Header: ''Authorization: Bearer
        <token>'''
    AccountContext:
      type: apiKey
      in: header
      name: X-Account-ID
      description: Active Seller Account UUID context for multi-tenant isolation
  parameters:
    AccountContextParam:
      name: X-Account-ID
      in: header
      required: true
      description: Active Seller Account UUID
      schema:
        type: string
        format: uuid
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque cursor string for keyset pagination
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Max number of items to return (1-50, default 20)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    ApiResponseGeneric:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
