          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - BearerAuth: []
        AccountContext: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /accounts/{accountId}/members/invite:
    post:
      tags:
      - Accounts
      summary: Invite Team Member to Account
      operationId: inviteAccountMember
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
