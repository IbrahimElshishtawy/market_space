openapi: 3.0.3
info:
  title: Deal One API Specification (صفقة ون)
  version: 1.0.0
  description: 'Production-grade OpenAPI 3.0.3 specification for the Deal One Hybrid
    Multi-Category Platform in Egypt.

    Serving Real Estate, Automotive, Building Materials, Services, Fashion, and Home
    Appliances.

    Contains all 55 REST endpoints, uniform response envelopes, cursor pagination,
    and security models.

    '
  contact:
    name: Deal One Engineering Team
    email: engineering@deal-one.eg
    url: https://deal-one.eg
servers:
- url: https://api.deal-one.eg/api/v1
  description: Production API Gateway (Cloudflare WAF Protected)
- url: https://staging-api.deal-one.eg/api/v1
  description: Staging Environment
- url: http://localhost:3000/api/v1
  description: Local Docker / Fastify Development Server
security:
- BearerAuth: []
tags:
- name: Authentication
  description: SMS OTP, JWT Access & Refresh Token Management
- name: Users
  description: User Profiles, FCM Device Tokens & Account Deletion
- name: Accounts
  description: Multi-Tenant Business Accounts, Verification & Team RBAC
- name: Locations
  description: Egypt Governorates, Cities, Granular Areas & Branches
- name: Categories
  description: Two-Level Taxonomy & Dynamic Attribute Definitions
- name: Listings
  description: 3-Axis Listing Lifecycle Management
- name: Search & Explore
  description: Faceted & Spatial PostGIS Discovery
- name: Media
  description: Direct Cloudflare R2 Presigned Uploads & Processing
- name: Chat
  description: In-App Listing-Bound Conversations & Messages
- name: Engagement
  description: Favorites & Abuse/Fraud Reporting
- name: Quotas & Notifications
  description: Daily Usage Limits & In-App Alerts
- name: Admin & Moderation
  description: Control Center, Content Moderation & Auditing
paths:
  /auth/otp/send:
    post:
      tags:
      - Authentication
      summary: Request 6-digit SMS OTP
      operationId: sendOtp
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOtpSend'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - turnstile_token
              properties:
                phone:
                  type: string
                  example: '+201012732095'
                  pattern: ^\+20(10|11|12|15)[0-9]{8}$
                turnstile_token:
                  type: string
                  example: 0.XXXXX.YYYYY
  /auth/otp/verify:
    post:
      tags:
      - Authentication
      summary: Verify SMS OTP and Sign In
      operationId: verifyOtp
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthTokens'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                  example: '+201012732095'
                code:
                  type: string
                  example: '583921'
                  pattern: ^[0-9]{6}$
                device_info:
                  type: object
                  properties:
                    platform:
                      type: string
                      enum:
                      - android
                      - ios
                      - web
                    fcm_token:
                      type: string
                    app_version:
                      type: string
  /auth/token/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate Refresh Token & Mint New Access Token
      operationId: refreshToken
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRefreshToken'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: 4f3c2b1a-8e9d-4c3b-2a1f-0e9d8c7b6a5f
  /auth/password/login:
    post:
      tags:
      - Authentication
      summary: Sign In with Email and Password
      operationId: loginPassword
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthTokens'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@deal-one.eg
                password:
                  type: string
                  format: password
                  minLength: 8
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Terminate Active Session
      operationId: logout
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActionSuccess'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
  /auth/sessions/terminate-all:
    post:
      tags:
      - Authentication
      summary: Revoke All Active User Sessions
      operationId: terminateAllSessions
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActionSuccess'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /users/me:
    get:
      tags:
      - Users
      summary: Get Current User Profile
      operationId: getMyProfile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      tags:
      - Users
      summary: Update Personal Profile
      operationId: updateMyProfile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 3
                email:
                  type: string
                  format: email
                avatar_url:
                  type: string
                  format: uri
  /users/devices:
