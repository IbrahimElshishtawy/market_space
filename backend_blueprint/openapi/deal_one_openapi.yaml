        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
      - BearerAuth: []
        AccountContext: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document_type
              - document_urls
              properties:
                document_type:
                  type: string
                  enum:
                  - commercial_register
                  - tax_card
                  - license
                  - national_id
                document_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                registration_number:
                  type: string
  /accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Get Public Account Profile and Details
      operationId: getAccountDetails
      responses:
