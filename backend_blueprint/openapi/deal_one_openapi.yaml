      security: []
  /locations/cities/{cityId}/areas:
    get:
      tags:
      - Locations
      summary: List Granular Neighborhoods in City
      operationId: listCityAreas
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
