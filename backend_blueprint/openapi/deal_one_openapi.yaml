        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
