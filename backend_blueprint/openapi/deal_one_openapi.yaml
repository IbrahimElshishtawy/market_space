            schema:
              type: object
              required:
              - fcm_token
              - platform
              properties:
                fcm_token:
                  type: string
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                  - web
                device_model:
                  type: string
                os_version:
                  type: string
  /users/me/delete-request:
    post:
      tags:
      - Users
      summary: Request Permanent User Deletion (GDPR/Compliance)
      operationId: requestDeletion
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActionSuccess'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
  /accounts/my-accounts:
    get:
      tags:
      - Accounts
      summary: List All Seller Accounts for Current User
      operationId: getMyAccounts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccountList'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
