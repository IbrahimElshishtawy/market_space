  /accounts:
    post:
      tags:
      - Accounts
      summary: Create New Seller Account
      operationId: createAccount
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAccount'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized / Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden / Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Rate limit or daily quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - account_type
              properties:
                display_name:
                  type: string
                  minLength: 3
                account_type:
                  type: string
                  enum:
                  - individual
                  - company
                  - factory
                  - store
                contact_phone:
                  type: string
                whatsapp_number:
                  type: string
                bio:
                  type: string
  /accounts/{accountId}/verification-documents:
    post:
      tags:
      - Accounts
      summary: Upload Commercial Documents for Verification
      operationId: uploadVerificationDocs
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActionSuccess'
        '400':
          description: Validation failed / Invalid parameters
