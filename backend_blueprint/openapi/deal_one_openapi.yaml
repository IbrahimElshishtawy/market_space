          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /locations/governorates:
    get:
      tags:
      - Locations
      summary: List Egypt Governorates with Nested Cities
      operationId: listGovernorates
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGovernoratesList'
        '400':
