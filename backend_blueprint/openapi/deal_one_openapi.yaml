      security:
      - BearerAuth: []
        AccountContext: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - role
              properties:
                phone:
                  type: string
                  pattern: ^\+20[0-9]{10}$
                role:
                  type: string
                  enum:
                  - manager
                  - lister
                  - responder
  /accounts/{accountId}/members/{userId}:
    delete:
      tags:
      - Accounts
      summary: Remove Member from Account Team
      operationId: removeAccountMember
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseActionSuccess'
        '400':
          description: Validation failed / Invalid parameters
          content:
            application/json:
