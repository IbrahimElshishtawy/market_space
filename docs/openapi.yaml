openapi: 3.1.0
info:
  title: Market Space API (سوق سبيس)
  version: 1.0.0
  description: Production-grade RESTful API for Market Space classifieds marketplace platform in Egypt.
servers:
  - url: https://api.marketspace.eg/api/v1
    description: Production API Server
  - url: http://localhost:3000/api/v1
    description: Local Development Server

paths:
  /auth/otp/send:
    post:
      summary: Request SMS OTP
      description: Dispatches a 6-digit numeric verification OTP to an Egyptian mobile phone number.
      operationId: sendOtp
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+201012732095"
                  pattern: '^\+20(10|11|12|15)[0-9]{8}$'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '429':
          description: Rate limit exceeded (Max 3 OTP requests per 15 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/otp/verify:
    post:
      summary: Verify SMS OTP & Sign In
      description: Verifies OTP code; returns Access Token and Refresh Token. Creates account if non-existent.
      operationId: verifyOtp
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  example: "+201012345678"
                code:
                  type: string
                  example: "123456"
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /categories:
    get:
      summary: List Categories Taxonomy
      description: Returns the full hierarchy of active root categories and subcategories with localized Arabic/English names.
      operationId: getCategories
      tags: [Categories]
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'

  /categories/{slug}/fields:
    get:
      summary: Get Dynamic Attribute Fields for Subcategory
      description: Returns configurable dynamic attribute schemas (e.g., year, mileage, finishing) and validation rules for a subcategory.
      operationId: getCategoryFields
      tags: [Categories]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "cars-for-sale"
      responses:
        '200':
          description: Dynamic fields schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryFieldsResponse'

  /listings:
    get:
      summary: Public Listings Feed
      description: Cursor-paginated listing feed filtered by category, governorate, city, price range, and attributes.
      operationId: getListings
      tags: [Listings]
      parameters:
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: governorate_id
          in: query
          schema:
            type: integer
        - name: city_id
          in: query
          schema:
            type: integer
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: condition
          in: query
          schema:
            type: string
            enum: [NEW, USED]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Listings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsFeedResponse'
    post:
      summary: Create New Listing
      description: Submits a new classified listing. Media keys must be pre-uploaded via presigned upload URLs.
      operationId: createListing
      tags: [Listings]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created (status PENDING_REVIEW or PUBLISHED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
        '400':
          description: Schema validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /listings/{id}:
    get:
      summary: Get Listing Detail
      description: Returns full listing information, attributes, images, video streaming details, and seller summary.
      operationId: getListingById
      tags: [Listings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed listing record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /media/images/upload-url:
    post:
      summary: Request Presigned Image Upload URLs
      description: Issues short-lived presigned S3/R2 PUT URLs for up to 10 photos directly to object storage.
      operationId: getPresignedImageUrls
      tags: [Media]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_types]
              properties:
                content_types:
                  type: array
                  items:
                    type: string
                    enum: [image/jpeg, image/png, image/webp]
                  minItems: 1
                  maxItems: 10
      responses:
        '200':
          description: Presigned upload targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlsResponse'

  /media/video/upload-token:
    post:
      summary: Request Cloudflare Stream Video Upload Token
      description: Issues a direct-creator upload endpoint from Cloudflare Stream for a single 30s video.
      operationId: getVideoUploadToken
      tags: [Media]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cloudflare Stream upload token & URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStreamTokenResponse'

  /video-feed:
    get:
      summary: Vertical Video Discovery Feed
      description: Returns an algorithmic or recent stream of approved listings with valid 30s videos for swipe exploration.
      operationId: getVideoFeed
      tags: [Search & Video]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Video feed listing items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoFeedResponse'

  /payments/checkout:
    post:
      summary: Initiate Paymob Promotion Checkout
      description: Creates a Paymob payment order for promotion packages (Featured Ad, Bump).
      operationId: createPaymentCheckout
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, package_id]
              properties:
                listing_id:
                  type: string
                  format: uuid
                package_id:
                  type: string
                  example: "FEATURED_7_DAYS"
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'

  /payments/webhook:
    post:
      summary: Paymob Transaction Webhook Callback
      description: Receives asynchronous transaction notifications from Paymob. Validates HMAC SHA512 signature and grants entitlements idempotently.
      operationId: paymobWebhook
      tags: [Payments]
      responses:
        '200':
          description: Webhook acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '401':
          description: HMAC Signature Mismatch

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponseGeneric:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_FAILED"
            message:
              type: string
              example: "Input validation error"
            details:
              type: array
              items:
                type: object
            requestId:
              type: string
              example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
            timestamp:
              type: string
              format: date-time

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                phone:
                  type: string
                  example: "+201012345678"
                full_name:
                  type: string
                  example: "أحمد محمود"
                role:
                  type: string
                  example: "USER"
            tokens:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken:
                  type: string
                  example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."
                expiresIn:
                  type: integer
                  example: 900

    CategoryTreeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
                example: "vehicles"
              name_ar:
                type: string
                example: "سيارات ومركبات"
              name_en:
                type: string
                example: "Vehicles"
              icon_name:
                type: string
                example: "car"
              subcategories:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                      example: "cars-for-sale"
                    name_ar:
                      type: string
                      example: "سيارات للبيع"
                    name_en:
                      type: string
                      example: "Cars for Sale"

    CategoryFieldsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              field_key:
                type: string
                example: "year"
              field_type:
                type: string
                enum: [TEXT, NUMBER, SELECT, MULTI_SELECT, BOOLEAN]
              label_ar:
                type: string
                example: "سنة الصنع"
              label_en:
                type: string
                example: "Manufacturing Year"
              is_required:
                type: boolean
              is_filterable:
                type: boolean
              validation_rules:
                type: object

    CreateListingRequest:
      type: object
      required: [category_id, city_id, title, description, price, media_keys]
      properties:
        category_id:
          type: string
          format: uuid
        city_id:
          type: integer
          example: 1
        title:
          type: string
          minLength: 10
          maxLength: 180
          example: "هيونداي إلنترا 2021 بحالة ممتازة فابريكا"
        description:
          type: string
          minLength: 20
          maxLength: 4000
          example: "سيارة هيونداي إلنترا CN7 موديل 2021 عداد 45000 كم صيانات توكيل بالكامل..."
        price:
          type: number
          minimum: 0
          example: 780000
        condition:
          type: string
          enum: [NEW, USED, NOT_APPLICABLE]
          default: USED
        attributes:
          type: object
          example:
            make: "Hyundai"
            model: "Elantra"
            year: 2021
            transmission: "Automatic"
        media_keys:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        video_stream_uid:
          type: string
          nullable: true

    ListingsFeedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListingSummary'
        meta:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true

    ListingSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        price:
          type: number
        condition:
          type: string
        governorate_name:
          type: string
          example: "القاهرة"
        city_name:
          type: string
          example: "مدينة نصر"
        is_featured:
          type: boolean
        primary_image_url:
          type: string
        has_video:
          type: boolean
        refreshed_at:
          type: string
          format: date-time

    ListingDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            description:
              type: string
            price:
              type: number
            condition:
              type: string
            status:
              type: string
            attributes:
              type: object
            images:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  public_url:
                    type: string
                  sort_order:
                    type: integer
            video:
              type: object
              nullable: true
              properties:
                stream_uid:
                  type: string
                hls_playback_url:
                  type: string
                thumbnail_url:
                  type: string
            seller:
              type: object
              properties:
                id:
                  type: string
                full_name:
                  type: string
                avatar_url:
                  type: string
                  nullable: true
                member_since:
                  type: string
                  format: date-time

    PresignedUrlsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: "uploads/images/2026/10/a843-uuid.jpg"
              upload_url:
                type: string
                example: "https://r2.marketspace.eg/uploads/images/...?X-Amz-Signature=..."
              public_url:
                type: string
                example: "https://cdn.marketspace.eg/uploads/images/2026/10/a843-uuid.jpg"

    VideoStreamTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            stream_uid:
              type: string
              example: "d83fb08d93c12a7bf8b2"
            upload_url:
              type: string
              example: "https://upload.videodelivery.net/d83fb08d93c12a7bf8b2"

    VideoFeedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              listing_id:
                type: string
                format: uuid
              title:
                type: string
              price:
                type: number
              city_name:
                type: string
              video_hls_url:
                type: string
              video_thumbnail_url:
                type: string
              seller_name:
                type: string

    CheckoutSessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            payment_id:
              type: string
              format: uuid
            checkout_url:
              type: string
              example: "https://accept.paymob.com/api/acceptance/iframes/12345?payment_token=..."
