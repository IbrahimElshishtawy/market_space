version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: marketspace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - marketspace-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketspace-api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://marketspace_app:secretpassword@postgres:5432/marketspace?schema=public}
      - REDIS_CACHE_HOST=redis_cache
      - REDIS_CACHE_PORT=6379
      - REDIS_QUEUE_HOST=redis_queue
      - REDIS_QUEUE_PORT=6380
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-deal_one_dev_jwt_access_secret_1234567890}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-deal_one_dev_jwt_refresh_secret_1234567890}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      redis_queue:
        condition: service_healthy
    networks:
      - marketspace-net

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: marketspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketspace}
      POSTGRES_USER: ${POSTGRES_USER:-marketspace_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketspace_app -d marketspace"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - marketspace-net

  redis_cache:
    image: redis:7.2-alpine
    container_name: marketspace-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--port", "6379", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - marketspace-net

  redis_queue:
    image: redis:7.2-alpine
    container_name: marketspace-redis-queue
    restart: unless-stopped
    command: ["redis-server", "--port", "6380", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6380"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - marketspace-net

volumes:
  postgres_data:
  redis_cache_data:
  redis_queue_data:

networks:
  marketspace-net:
    driver: bridge
